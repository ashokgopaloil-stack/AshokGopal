[build]
  command = "export PATH=/opt/buildhome/.nvm/versions/node/v22.22.2/bin:$PATH && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/instagram"
  to = "https://www.instagram.com/ashokgopaloil/"
  status = 301
  force = true

[[redirects]]
  from = "/instagram/*"
  to = "https://www.instagram.com/ashokgopaloil/"
  status = 301
  force = true
