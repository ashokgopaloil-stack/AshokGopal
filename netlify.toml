[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/facebook"
  to = "https://www.facebook.com/ashokgopaloil"
  status = 302

[[redirects]]
  from = "/instagram"
  to = "https://www.instagram.com/ashokgopaloil/"
  status = 302
